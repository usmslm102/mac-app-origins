name: Release Unsigned DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build community DMG
        env:
          APP_VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./package-dmg.sh
          export APP_VERSION="${APP_VERSION#v}"
          ./package-dmg.sh

      - name: Create checksum
        run: shasum -a 256 AppOrigins.dmg > AppOrigins.dmg.sha256

      - name: Verify packaged app signature and version
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/apporigins-release"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/apporigins-release" AppOrigins.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/apporigins-release"' EXIT
          RELEASE_APP="$RUNNER_TEMP/apporigins-release/AppOrigins.app"
          codesign --verify --deep --strict --verbose=2 "$RELEASE_APP"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RELEASE_APP/Contents/Info.plist")
          test "$ACTUAL_VERSION" = "${EXPECTED_VERSION#v}"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" AppOrigins.dmg AppOrigins.dmg.sha256 --clobber
          else
            gh release create "$TAG_NAME" \
              AppOrigins.dmg \
              AppOrigins.dmg.sha256 \
              --title "$TAG_NAME" \
              --notes "Ad-hoc signed community build; not Developer ID signed or notarized."
          fi
